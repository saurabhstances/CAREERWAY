<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CareerWay Hub | Register</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:linear-gradient(135deg,#eef7ff,#d7ecff,#c8e7ff,#eef8ff);
position:relative;
}
body:before,body:after{
content:"";
position:absolute;
border-radius:50%;
filter:blur(60px);
animation:move 8s ease-in-out infinite alternate;
}
body:before{width:450px;height:450px;background:#4f9dff55;left:-120px;top:-100px}
body:after{width:350px;height:350px;background:#6ee7ff55;right:-80px;bottom:-80px}

.grid{
position:absolute;
inset:0;
background-image:
linear-gradient(rgba(37,99,235,.05) 1px,transparent 1px),
linear-gradient(90deg,rgba(37,99,235,.05) 1px,transparent 1px);
background-size:60px 60px;
}

.hex{
position:absolute;
border:2px solid rgba(37,99,235,.15);
transform:rotate(45deg);
animation:float 8s ease-in-out infinite;
}
.h1{width:120px;height:120px;left:8%;top:18%}
.h2{width:80px;height:80px;right:10%;top:15%;animation-delay:2s}
.h3{width:150px;height:150px;left:12%;bottom:10%;animation-delay:3s}
.h4{width:100px;height:100px;right:15%;bottom:15%;animation-delay:1s}

.brand{
position:absolute;
left:60px;
top:50%;
transform:translateY(-50%);
max-width:430px;
}
.brand h1{
font-size:60px;
font-weight:700;
color:#174ea6;
line-height:1;
}
.brand h1 span{color:#2563eb}
.brand p{
margin-top:18px;
color:#475569;
font-size:18px;
line-height:1.7;
}
.tag{
display:inline-block;
margin-top:25px;
padding:12px 22px;
background:#fff;
border-radius:30px;
color:#2563eb;
font-weight:600;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.card{
width:430px;
padding:35px;
border-radius:24px;
background:rgba(255,255,255,.35);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.6);
box-shadow:0 20px 60px rgba(0,0,0,.12);
animation:up .7s;
}

.logo{
width:75px;
height:75px;
margin:auto;
background:#fff;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:32px;
color:#2563eb;
}

.card h2{
margin:18px 0 6px;
text-align:center;
}

.card p{
text-align:center;
color:#666;
margin-bottom:25px;
font-size:14px;
}

.input{
position:relative;
margin-bottom:18px;
}

.input i{
position:absolute;
left:15px;
top:17px;
color:#666;
}

.input input,
.input select{
width:100%;
padding:14px 45px;
border:none;
border-radius:12px;
background:#fff;
font-size:15px;
}

.input input:focus,
.input select:focus{
outline:none;
box-shadow:0 0 0 3px #93c5fd;
}

.eye{
left:auto!important;
right:16px;
cursor:pointer;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#2563eb,#4f46e5);
color:#fff;
font-size:17px;
font-weight:600;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:translateY(-3px);
box-shadow:0 15px 30px rgba(37,99,235,.3);
}

.login{
display:block;
text-align:center;
margin-top:18px;
color:#2563eb;
font-size:14px;
text-decoration:none;
font-weight:600;
}

@keyframes float{50%{transform:rotate(45deg) translateY(-20px)}}
@keyframes move{100%{transform:translate(40px,30px)}}
@keyframes up{from{opacity:0;transform:translateY(40px)}}

@media(max-width:1000px){
.brand{display:none}
.card{width:92%}
}
</style>
</head>

<body>

<div class="grid"></div>

<div class="hex h1"></div>
<div class="hex h2"></div>
<div class="hex h3"></div>
<div class="hex h4"></div>

<div class="brand">
<h1>Career<span>Way</span><br>Hub</h1>
<p>India's Smart AI Powered Job Portal connecting talented students with top recruiters.</p>
<div class="tag">🚀 Launch Your Dream Career</div>
</div>

<div class="card">

<div class="logo">
<i class="fa-solid fa-briefcase"></i>
</div>

<h2>Create Account</h2>

<p>Join thousands of professionals today.</p>

<form method="POST">

<div class="input">
<i class="fa-solid fa-user"></i>
<input type="text" name="name" placeholder="Full Name" required>
</div>

<div class="input">
<i class="fa-solid fa-envelope"></i>
<input type="email" name="email" placeholder="Email Address" required>
</div>

<div class="input">
<i class="fa-solid fa-lock"></i>
<input id="pwd" type="password" name="password" placeholder="Password" required>
<i class="fa-solid fa-eye eye" id="eye"></i>
</div>

<div class="input">
<i class="fa-solid fa-user-graduate"></i>
<select name="role">
<option>Student</option>
<option>Recruiter</option>
</select>
</div>

<button>Create Account <i class="fa-solid fa-arrow-right"></i></button>

<a class="login" href="{{ url_for('login') }}">
<i class="fa-solid fa-arrow-left"></i> Back to Login
</a>

</form>

</div>

<script>
const eye=document.getElementById("eye"),pwd=document.getElementById("pwd");
eye.onclick=()=>{pwd.type=pwd.type=="password"?"text":"password";
eye.className="fa-solid "+(pwd.type=="text"?"fa-eye-slash":"fa-eye")+" eye";}
</script>

</body>
</html>
